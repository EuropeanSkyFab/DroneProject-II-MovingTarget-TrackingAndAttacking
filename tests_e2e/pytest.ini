[pytest]
testpaths = self_check tier1 tier2 tier3 tier4
python_files = test_*.py
python_functions = test_*
addopts = --strict-markers -ra
markers =
    tier1: Tier 1 per-feature functional verification tests
    tier2: Tier 2 boundary-value analysis (BVA) and corner-case tests
    tier3: Tier 3 pairwise feature combination tests
    tier4: Tier 4 real-world end-to-end operational scenario tests
    self_check: Self-check unit tests for tests_e2e automated verifiers and runner
    feature(id): Associate a test with a feature F1..F11
    requires_m1: Requires M1 deliverables (GPU-3 isolation, 3D obstacle arena, N-UAV launch)
    requires_m2: Requires M2 deliverables (multi-target perception and epipolar association)
    requires_m3: Requires M3 deliverables (Hungarian/IMM tracker, WTA and 3D APN guidance)
    requires_m4: Requires M4 deliverables (3D CBF safety shield, feedforward and strike loop)
    requires_m5: Requires M5 deliverables (cinema rendering pipeline and showcase MP4)
    requires_sitl: Requires live PX4 + Gazebo Harmonic SITL execution or recorded SITL run
    pre_integration_safe: Safe to run in pre_integration mode before M1-M5 integration
